# ========================================
# 多模态目标检测 - CPU 训练配置
# 适配 16GB 内存 CPU 机器：小 batch、单 worker、关闭 AMP
# 用法: python scripts/02_train.py --config configs/train_cpu.yaml
# ========================================

# ---- 数据配置 ----
data_root: "../dataset"
img_size: 640
num_classes: 12
batch_size: 8             # CPU 16GB 内存建议 8
num_workers: 0            # CPU 环境避免 DataLoader 多进程内存翻倍
val_split: 0.15

# ---- 模型配置 ----
fusion_mode: "stage_gate"
model_size: "n"
device: "cpu"             # 强制 CPU（cuda 会自动回退，这里显式声明）
pretrained: true
pretrained_path: "weights/yolov8n.pt"
resume: ""

# ---- 模态配置 ----
use_aux: true
modal_dropout_prob: 0.3

# ---- 两阶段训练（CPU 估算：~0.7s/步，1 epoch≈107 步≈2~3 分钟）----
stage1_epochs: 15
stage1_lr: 0.001
stage2_epochs: 30
stage2_lr: 0.0001

# ---- 损失权重 ----
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
  aux_weights:
    ir_contrast: 0.30
    depth_mask: 0.20
    depth_normal: 0.15
  total_aux: 0.15

# ---- 优化器 ----
optimizer: "adamw"
weight_decay: 0.0005
grad_clip: 10.0
gradient_accum: 1
amp: false                # CPU 无混合精度

# ---- 学习率 ----
lr_scheduler: "cosine"
warmup_epochs: 3

# ---- 早停 ----
early_stopping: true
patience: 10

# ---- 验证 ----
val_interval: 1
ema: true

# ---- 保存路径 ----
checkpoint_dir: "weights/checkpoints"
best_model_dir: "weights/best"
log_dir: "outputs/logs"

# ---- 类别名称（官方 12 类，顺序 = 类别 ID 0~11，禁止修改）----
class_names:
  - "person"
  - "boat"
  - "animal"
  - "seat"
  - "sign"
  - "bicycle"
  - "car"
  - "ball"
  - "light"
  - "garbagecan"
  - "uav"
  - "tricycle"

# ---- 预处理参数 ----
preprocess:
  ir_kernel_size: 15
  depth_min_mm: 300
  depth_max_mm: 20000

# ---- 数据增强 ----
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flip_lr: 0.5
  scale: 0.5
  mosaic: 0.0
  mixup: 0.0

# ---- 推理配置 ----
inference:
  conf_threshold: 0.001
  nms_iou_threshold: 0.5
  max_det: 100
  use_soft_nms: true
  use_tta: false
  tta_scales: [640, 800, 960]
  tta_flip: true
