data_root: ../dataset
img_size: 320
num_classes: 12
batch_size: 16
num_workers: 0
val_split: 0.15
fusion_mode: stage_gate
model_size: n
device: cpu
pretrained: true
pretrained_path: weights/yolov8n.pt
resume: ''
use_aux: true
modal_dropout_prob: 0.3
stage1_epochs: 1
stage1_lr: 0.001
stage2_epochs: 0
stage2_lr: 0.0001
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
  aux_weights:
    ir_contrast: 0.3
    depth_mask: 0.2
    depth_normal: 0.15
  total_aux: 0.15
optimizer: adamw
weight_decay: 0.0005
grad_clip: 10.0
gradient_accum: 1
amp: false
lr_scheduler: cosine
warmup_epochs: 3
early_stopping: true
patience: 10
val_interval: 1
ema: true
checkpoint_dir: weights/checkpoints
best_model_dir: weights/best
log_dir: outputs/logs
class_names:
- person
- boat
- animal
- seat
- sign
- bicycle
- car
- ball
- light
- garbagecan
- uav
- tricycle
preprocess:
  ir_kernel_size: 15
  depth_min_mm: 300
  depth_max_mm: 20000
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flip_lr: 0.5
  scale: 0.5
  mosaic: 0.0
  mixup: 0.0
inference:
  conf_threshold: 0.001
  nms_iou_threshold: 0.5
  max_det: 100
  use_soft_nms: true
  use_tta: false
  tta_scales:
  - 640
  - 800
  - 960
  tta_flip: true
